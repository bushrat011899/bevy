[package]
name = "bevy_tasks"
version = "0.16.0-dev"
edition = "2024"
description = "A task executor for Bevy Engine"
homepage = "https://bevyengine.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
default = ["bevy_platform/default", "async_executor", "futures-lite-block-on"]

# Enables multi-threading support.
# Without this feature, all tasks will be run on a single thread.
multi_threaded = [
  "bevy_platform/std",
  "dep:async-channel",
  "dep:concurrent-queue",
]

# Uses `async-executor` as a task execution backend.
# This backend is incompatible with `no_std` targets.
async_executor = ["dep:async-executor"]

# Uses `async-io` for asynchronous IO integration.
async-io = ["dep:async-io"]

# Re-exports the `block_on` function from `futures-lite` if `async-io` is not enabled.
futures-lite-block-on = ["futures-lite/std"]

# Integrates with the web browser event loop for ticking pending tasks.
# Does nothing on non-browser targets.
web-event-loop = [
  "bevy_platform/web",
  "dep:wasm-bindgen-futures",
  "dep:pin-project",
  "dep:futures-channel",
]

[dependencies]
bevy_platform = { path = "../bevy_platform", version = "0.16.0-dev", default-features = false, features = [
  "alloc",
] }

futures-lite = { version = "2.0.1", default-features = false, features = [
  "alloc",
] }
async-task = { version = "4.4.0", default-features = false }
derive_more = { version = "1", default-features = false, features = [
  "deref",
  "deref_mut",
] }
async-executor = { version = "1.11", optional = true }
async-channel = { version = "2.3.0", optional = true }
async-io = { version = "2.0.0", optional = true }
concurrent-queue = { version = "2.0.0", optional = true }
atomic-waker = { version = "1", default-features = false }
crossbeam-queue = { version = "0.3", default-features = false, features = [
  "alloc",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
pin-project = { version = "1", optional = true }
futures-channel = { version = "0.3", optional = true }

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies]
async-task = { version = "4.4.0", default-features = false, features = [
  "portable-atomic",
] }
heapless = { version = "0.8", default-features = false, features = [
  "portable-atomic",
] }
atomic-waker = { version = "1", default-features = false, features = [
  "portable-atomic",
] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["-Zunstable-options", "--generate-link-to-definition"]
all-features = true
